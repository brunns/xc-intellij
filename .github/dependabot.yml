# Dependabot configuration:
# https://docs.github.com/en/free-pro-team@latest/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore (deps)"
    allow:
      - dependency-type: "all"
    labels:
      - "dependencies"
      - "gradle"
    cooldown:
      default-days: 7
    assignees:
      - "brunns"
    groups:
      development:
        dependency-type: "development"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore (gha)"
    labels:
      - "gha"
      - "ci"
    assignees:
      - "brunns"
    cooldown:
      default-days: 7
